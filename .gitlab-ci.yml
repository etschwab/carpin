image: node:22

stages:
  - validate

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

validate:
  stage: validate
  script:
    - npm ci --cache .npm --prefer-offline --no-audit
    - npx expo install --check
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
